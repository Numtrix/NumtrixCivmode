[build]
  command = "curl -s https://get.sdkman.io | bash && export SDKMAN_DIR=\"$HOME/.sdkman\" && [[ -s \"$HOME/.sdkman/bin/sdkman-init.sh\" ]] && source \"$HOME/.sdkman/bin/sdkman-init.sh\" && sdk install java 21.0.4-tem && sdk use java 21.0.4-tem && chmod +x gradlew && ./gradlew :web:webBuildJs --no-daemon -Dorg.gradle.jvmargs=\"-Xmx3g -Xms1g\""
  publish = "web/build/dist"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"
