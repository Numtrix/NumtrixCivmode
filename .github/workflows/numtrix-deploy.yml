name: Numtrix Frontiers — Build & Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "numtrix-deploy"
  cancel-in-progress: true

jobs:
  build:
    name: Build Web JS Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Clone Numtrix-Assets-Vault
        uses: actions/checkout@v4
        with:
          repository: Numtrix/Numtrix-Assets-Vault
          token: ${{ secrets.VAULT_TOKEN }}
          path: _vault

      - name: Merge vault into engine
        run: |
          echo "=== Merging vault overlays ==="

          # 1. Direct asset files (skip _merge and overlay dirs)
          for dir in android fastlane; do
            if [ -d "_vault/$dir" ]; then
              find "_vault/$dir" -type f ! -path '*/overlay/*' ! -path '*/_merge/*' | while read src; do
                rel="${src#_vault/}"
                mkdir -p "$(dirname "$rel")"
                cp "$src" "$rel"
                echo "  [copy] $rel"
              done
            fi
          done

          # 2. Module overlays (core/overlay/..., desktop/overlay/..., web/overlay/...)
          for module in core desktop web; do
            overlay_dir="_vault/$module/overlay"
            if [ -d "$overlay_dir" ]; then
              find "$overlay_dir" -type f | while read src; do
                rel_from_overlay="${src#$overlay_dir/}"
                dest="$module/$rel_from_overlay"
                mkdir -p "$(dirname "$dest")"
                cp "$src" "$dest"
                echo "  [overlay] $module/$rel_from_overlay"
              done
            fi
          done

          # 3. JSON array merges (_merge directories — APPEND to engine arrays)
          #    Engine JSON files may contain JS-style comments, so we strip them first
          find "_vault" -path '*/_merge/*.json' -type f | while read src; do
            rel="${src#_vault/}"
            dest_rel="$(echo "$rel" | sed 's|/_merge/|/|')"
            if [ -f "$dest_rel" ]; then
              echo "  [merge] $dest_rel"
              node -e "
                const fs = require('fs');
                function parseJsonWithComments(text) {
                  // Strip single-line comments (// ...) but not inside strings
                  const stripped = text.replace(/^(\s*)\/\/.*$/gm, '');
                  // Also strip trailing commas before ] or }
                  const cleaned = stripped.replace(/,(\s*[\]}])/g, '\$1');
                  return JSON.parse(cleaned);
                }
                const engineText = fs.readFileSync('$dest_rel', 'utf8');
                const vaultText = fs.readFileSync('$src', 'utf8');
                const engine = parseJsonWithComments(engineText);
                const vault = JSON.parse(vaultText);
                if (Array.isArray(engine) && Array.isArray(vault)) {
                  const merged = engine.concat(vault);
                  fs.writeFileSync('$dest_rel', JSON.stringify(merged, null, 2));
                  console.log('    Merged ' + vault.length + ' entries (total: ' + merged.length + ')');
                }
              "
            else
              echo "  [merge-new] $dest_rel"
              mkdir -p "$(dirname "$dest_rel")"
              cp "$src" "$dest_rel"
            fi
          done

          echo "=== Vault merge complete ==="

      - name: Build web toolchain container
        run: docker build -f .devcontainer/Dockerfile -t unciv-web-builder .

      - name: Build JS bundle
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            unciv-web-builder \
            bash -lc "./gradlew --configuration-cache :web:webBuildJs"

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
